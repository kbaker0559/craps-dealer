<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Craps Dealer">
  <meta name="theme-color" content="#064e3b">
  <link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Craps Dealer</title>
  <style>
    :root{--felt:#064e3b;--felt2:#022c22;--chip:#f8fafc;--gold:#facc15;--ink:#111827;--muted:#d1fae5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));color:white;background:radial-gradient(circle at top,rgba(255,255,255,.10),transparent 28%),linear-gradient(160deg,var(--felt),var(--felt2))}.app{max-width:540px;margin:0 auto}h1{margin:2px 0;text-align:center;font-size:31px}.subtitle{margin:0 0 14px;text-align:center;color:var(--muted);font-size:14px}.panel{background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.16);border-radius:24px;padding:15px;box-shadow:0 12px 28px rgba(0,0,0,.28)}label{display:block;margin:13px 0 8px;font-weight:900;font-size:14px;color:#ecfdf5}.grid{display:grid;gap:9px}.cats,.nums{grid-template-columns:repeat(3,1fr)}button{appearance:none;border:0;border-radius:18px;min-height:58px;padding:10px 8px;font-weight:950;font-size:19px;color:var(--ink);background:var(--chip);box-shadow:0 4px 0 rgba(0,0,0,.32)}button:active{transform:translateY(2px)}button.selected{background:var(--gold)}.cat{font-size:17px}.hidden{display:none}input{width:100%;border:0;outline:0;border-radius:20px;padding:14px 18px;font-size:40px;font-weight:950;text-align:center;color:#111827;background:#fff;box-shadow:inset 0 0 0 3px rgba(250,204,21,.35)}.result{margin-top:15px;border-radius:24px;padding:14px;text-align:center;background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.12)}.context{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;color:#bbf7d0;font-size:14px;margin-bottom:5px}.context strong{color:white}.payout-label{margin-top:6px;color:#fde68a;font-size:18px;font-weight:950;letter-spacing:.14em}.payout{margin:2px 0 4px;font-size:72px;line-height:.98;font-weight:1000;color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.35)}.formula{color:#d1fae5;font-size:12px;min-height:17px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.actions button{min-height:48px;font-size:17px;background:#d1d5db}.actions .primary{background:#facc15}.voice-panel{margin:0 0 14px;padding:12px;border-radius:20px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.16)}.voice-btn{width:100%;background:#facc15;font-size:21px}.voice-btn.listening{background:#fecaca}.voice-status{margin-top:9px;text-align:center;color:#d1fae5;font-size:14px;min-height:20px}.voice-heard{margin-top:4px;text-align:center;color:white;font-size:13px;min-height:18px}
  </style>
</head><body><main class="app"><h1>🎲 Craps Dealer</h1><p class="subtitle">Tap bet → tap number → enter amount</p><section class="panel"><div class="voice-panel"><button id="voiceBtn" class="voice-btn">🎤 ASK DEALER</button><div id="voiceStatus" class="voice-status">Tap and say “Place eight, thirty-six dollars.”</div><div id="voiceHeard" class="voice-heard"></div></div><label>Bet</label><div class="grid cats" id="betTypes"><button class="cat" data-type="passOdds">Odds</button><button class="cat" data-type="place">Place</button><button class="cat" data-type="buy">Buy</button><button class="cat" data-type="lay">Lay</button><button class="cat" data-type="field">Field</button><button class="cat" data-type="hardway">Hard</button><button class="cat" data-type="prop">Props</button></div><div id="numberSection" class="hidden"><label id="numberLabel">Number</label><div class="grid nums" id="numbers"></div></div><div id="subSection" class="hidden"><label id="subLabel">Roll</label><div class="grid nums" id="subNumbers"></div></div><div id="amountSection" class="hidden"><label for="betAmount">Amount</label><input id="betAmount" inputmode="decimal" type="number" min="0" step="0.01" placeholder="125"></div><div class="result"><div class="context"><span>Bet: <strong id="typeOut">—</strong></span><span>Number: <strong id="numOut">—</strong></span></div><div class="payout-label">PAYOUT</div><div class="payout" id="payOut">$0</div><div class="formula" id="formulaOut">Choose a bet type.</div></div><div class="actions"><button id="sameBetBtn" class="primary">Same Bet</button><button id="clearBtn">New Bet</button></div></section></main>
<script>
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));
const amountInput=document.getElementById("betAmount"),betTypeButtons=Array.from(document.querySelectorAll("[data-type]")),numbersDiv=document.getElementById("numbers"),numberSection=document.getElementById("numberSection"),subSection=document.getElementById("subSection"),subNumbers=document.getElementById("subNumbers"),amountSection=document.getElementById("amountSection"),numberLabel=document.getElementById("numberLabel"),typeOut=document.getElementById("typeOut"),numOut=document.getElementById("numOut"),payOut=document.getElementById("payOut"),formulaOut=document.getElementById("formulaOut"),clearBtn=document.getElementById("clearBtn"),sameBetBtn=document.getElementById("sameBetBtn"),voiceBtn=document.getElementById("voiceBtn"),voiceStatus=document.getElementById("voiceStatus"),voiceHeard=document.getElementById("voiceHeard");
let selectedType=null,selectedNumber=null,hornHighNumber=null,hornHighRoll=null;
localStorage.removeItem("lastAmount");
const labels={passOdds:"Odds",place:"Place",buy:"Buy",lay:"Lay",field:"Field",hardway:"Hard",prop:"Props"};
const numberSets={passOdds:[4,5,6,8,9,10],place:[4,5,6,8,9,10],buy:[4,5,6,8,9,10],lay:[4,5,6,8,9,10],field:[2,3,4,9,10,11,12],hardway:["Hard 4","Hard 6","Hard 8","Hard 10"],prop:["Any 7","Any Craps","Aces","Ace-Deuce","Yo 11","Boxcars","C&E Craps","C&E Eleven","Horn 2","Horn 3","Horn 11","Horn 12","Horn High"]};
function fmt(n){if(!isFinite(n))n=0;if(Math.abs(n-Math.round(n))<.005)return n.toLocaleString(undefined,{style:"currency",currency:"USD",maximumFractionDigits:0});return n.toLocaleString(undefined,{style:"currency",currency:"USD",minimumFractionDigits:2,maximumFractionDigits:2})}
function multiplier(type,n){if(type==="passOdds"){if(n===4||n===10)return[2,"4/10 pays 2:1"];if(n===5||n===9)return[1.5,"5/9 pays 3:2"];if(n===6||n===8)return[1.2,"6/8 pays 6:5"]}if(type==="place"){if(n===4||n===10)return[1.8,"Place 4/10 pays 9:5"];if(n===5||n===9)return[1.4,"Place 5/9 pays 7:5"];if(n===6||n===8)return[7/6,"Place 6/8 pays 7:6"]}if(type==="buy"){if(n===4||n===10)return[2,"Buy pays true odds before vig"];if(n===5||n===9)return[1.5,"Buy pays true odds before vig"];if(n===6||n===8)return[1.2,"Buy pays true odds before vig"]}if(type==="lay"){if(n===4||n===10)return[.5,"Lay 4/10 pays 1:2 before vig"];if(n===5||n===9)return[2/3,"Lay 5/9 pays 2:3 before vig"];if(n===6||n===8)return[5/6,"Lay 6/8 pays 5:6 before vig"]}if(type==="field"){if(n===2||n===12)return[2,"Field 2/12 pays double"];return[1,"Field pays even money"]}if(type==="hardway"){if(n==="Hard 4"||n==="Hard 10")return[7,"Hard 4/10 pays 7:1"];if(n==="Hard 6"||n==="Hard 8")return[9,"Hard 6/8 pays 9:1"]}if(type==="prop"){if(n==="Any 7")return[4,"Any Seven pays 4:1"];if(n==="Any Craps")return[7,"Any Craps pays 7:1"];if(n==="Aces"||n==="Boxcars")return[30,"Aces/Boxcars pays 30:1"];if(n==="Ace-Deuce"||n==="Yo 11")return[15,"Ace-Deuce/Yo pays 15:1"];if(n==="C&E Craps")return[3,"C&E craps result: net 3x total wager"];if(n==="C&E Eleven")return[7,"C&E eleven result: net 7x total wager"];if(n==="Horn 2"||n==="Horn 12")return[6.75,"Horn 2/12: net winnings after three losing portions"];if(n==="Horn 3"||n==="Horn 11")return[3,"Horn 3/11: net winnings after three losing portions"]}return[0,""]}
function resetAmount(){amountInput.value="";amountSection.classList.add("hidden")}
function showAmount(){amountInput.value="";amountSection.classList.remove("hidden");calculate();setTimeout(()=>amountInput.focus(),50)}
function showHornHighChoices(){numbersDiv.innerHTML="";numberLabel.textContent="High Number";[2,3,11,12].forEach(n=>{const b=document.createElement("button");b.textContent="High "+n;b.onclick=()=>{hornHighNumber=n;Array.from(numbersDiv.children).forEach(x=>x.classList.remove("selected"));b.classList.add("selected");showHornHighRolls();calculate()};numbersDiv.appendChild(b)})}
function showHornHighRolls(){subNumbers.innerHTML="";hornHighRoll=null;resetAmount();subSection.classList.remove("hidden");[2,3,11,12].forEach(n=>{const b=document.createElement("button");b.textContent="Roll "+n;b.onclick=()=>{hornHighRoll=n;Array.from(subNumbers.children).forEach(x=>x.classList.remove("selected"));b.classList.add("selected");showAmount()};subNumbers.appendChild(b)})}
function renderNumbers(){numbersDiv.innerHTML="";subNumbers.innerHTML="";selectedNumber=null;hornHighNumber=null;hornHighRoll=null;subSection.classList.add("hidden");resetAmount();if(!selectedType){numberSection.classList.add("hidden");return}numberSection.classList.remove("hidden");numberLabel.textContent=selectedType==="field"?"Roll":selectedType==="hardway"?"Hardway":selectedType==="prop"?"Result":"Number";numberSets[selectedType].forEach(n=>{const b=document.createElement("button");b.textContent=n;b.onclick=()=>{selectedNumber=isNaN(Number(n))?n:Number(n);Array.from(numbersDiv.children).forEach(x=>x.classList.remove("selected"));b.classList.add("selected");if(selectedType==="prop"&&n==="Horn High"){resetAmount();showHornHighChoices();return}subSection.classList.add("hidden");showAmount()};numbersDiv.appendChild(b)})}
function hornHighPayout(bet,high,roll){const unit=bet/5,winningUnits=roll===high?2:1,losingUnits=5-winningUnits,odds=(roll===2||roll===12)?30:15;return winningUnits*unit*odds-losingUnits*unit}
function calculate(){const bet=parseFloat(amountInput.value||"0");typeOut.textContent=selectedType?labels[selectedType]:"—";if(selectedType==="prop"&&selectedNumber==="Horn High"){numOut.textContent=hornHighNumber?(hornHighRoll?`High ${hornHighNumber} / Roll ${hornHighRoll}`:`High ${hornHighNumber}`):"Horn High";if(!hornHighNumber){payOut.textContent="$0";formulaOut.textContent="Choose the Horn High number.";return}if(!hornHighRoll){payOut.textContent="$0";formulaOut.textContent="Choose the roll.";return}payOut.textContent=fmt(hornHighPayout(bet,hornHighNumber,hornHighRoll));formulaOut.textContent=`Horn High ${hornHighNumber}: ${hornHighRoll===hornHighNumber?"2":"1"} unit${hornHighRoll===hornHighNumber?"s":""} wins; losing portions deducted`;return}numOut.textContent=selectedNumber??"—";if(!selectedType||selectedNumber===null){payOut.textContent="$0";formulaOut.textContent=selectedType?"Choose a number/result.":"Choose a bet type.";return}const[mult,formula]=multiplier(selectedType,selectedNumber);payOut.textContent=fmt(bet*mult);formulaOut.textContent=formula}

function normalizeSpeech(s){return s.toLowerCase().replace(/-/g," ").replace(/\$/g," ").replace(/[?,.!]/g," ").replace(/\bforty\b/g,"40").replace(/\bfifty\b/g,"50").replace(/\bsixty\b/g,"60").replace(/\bseventy\b/g,"70").replace(/\beighty\b/g,"80").replace(/\bninety\b/g,"90").replace(/\bthirty\b/g,"30").replace(/\btwenty\b/g,"20").replace(/\btwelve\b/g,"12").replace(/\beleven\b/g,"11").replace(/\bten\b/g,"10").replace(/\bnine\b/g,"9").replace(/\beight\b/g,"8").replace(/\bseven\b/g,"7").replace(/\bsix\b/g,"6").replace(/\bfive\b/g,"5").replace(/\bfour\b/g,"4").replace(/\bthree\b/g,"3").replace(/\btwo\b/g,"2").replace(/\bone\b/g,"1").replace(/\s+/g," ").trim()}
function parseVoice(raw){const t=normalizeSpeech(raw);let type=null,n=null;if(/\bplace\b/.test(t))type="place";else if(/\bbuy\b/.test(t))type="buy";else if(/\blay\b/.test(t))type="lay";else if(/\bodds?\b/.test(t))type="passOdds";else if(/\bfield\b/.test(t))type="field";else if(/\bhard(?:way)?\b/.test(t))type="hardway";const nums=(t.match(/\b\d+(?:\.\d+)?\b/g)||[]).map(Number);if(type==="place"||type==="buy"||type==="lay"||type==="passOdds")n=nums.find(x=>[4,5,6,8,9,10].includes(x));else if(type==="hardway"){const x=nums.find(x=>[4,6,8,10].includes(x));if(x)n="Hard "+x}else if(type==="field")n=nums.find(x=>[2,3,4,9,10,11,12].includes(x));const betNum=typeof n==="number"?n:(n?Number(n.replace(/\D/g,"")):null);let amount=null;const m=t.match(/(?:for|bet|amount|dollars?|bucks?)\s+(\d+(?:\.\d+)?)/);if(m)amount=Number(m[1]);if(amount===null){const candidates=nums.filter((x,i)=>x!==betNum||i!==nums.indexOf(betNum));if(candidates.length)amount=candidates[candidates.length-1]}return{type,n,amount}}
function sayPayout(text){if("speechSynthesis" in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";speechSynthesis.speak(u)}}
function handleVoice(raw){voiceHeard.textContent='Heard: “'+raw+'”';const c=parseVoice(raw);if(!c.type){voiceStatus.textContent='I did not catch the bet type. Try “Place eight, thirty-six dollars.”';return}if(c.n===null||c.n===undefined){voiceStatus.textContent="I heard the bet, but not the number.";return}if(!(c.amount>0)){voiceStatus.textContent="I heard the bet and number, but not the wager amount.";return}selectedType=c.type;betTypeButtons.forEach(b=>b.classList.toggle("selected",b.dataset.type===selectedType));renderNumbers();const target=Array.from(numbersDiv.children).find(b=>b.textContent===String(c.n));if(!target){voiceStatus.textContent="That number is not available for this bet.";return}target.click();amountInput.value=String(c.amount);calculate();voiceStatus.textContent="Payout is "+payOut.textContent+".";sayPayout("Payout is "+payOut.textContent.replace("$","")+" dollars") }
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(SpeechRecognition){const recognition=new SpeechRecognition();recognition.lang="en-US";recognition.interimResults=false;recognition.maxAlternatives=3;voiceBtn.addEventListener("click",()=>{try{recognition.start();voiceStatus.textContent="Listening…";voiceHeard.textContent="";voiceBtn.classList.add("listening");voiceBtn.textContent="🎤 LISTENING…"}catch(e){}});recognition.addEventListener("result",e=>handleVoice(e.results[0][0].transcript));recognition.addEventListener("end",()=>{voiceBtn.classList.remove("listening");voiceBtn.textContent="🎤 ASK DEALER"});recognition.addEventListener("error",e=>{voiceStatus.textContent=e.error==="not-allowed"?"Microphone permission is needed for voice payouts.":"I couldn't hear that clearly. Tap ASK DEALER and try again.";voiceBtn.classList.remove("listening");voiceBtn.textContent="🎤 ASK DEALER"})}else{voiceBtn.disabled=true;voiceBtn.textContent="🎤 VOICE NOT AVAILABLE";voiceStatus.textContent="Voice recognition is not available here. The regular calculator still works."}

betTypeButtons.forEach(btn=>btn.onclick=()=>{selectedType=btn.dataset.type;betTypeButtons.forEach(b=>b.classList.remove("selected"));btn.classList.add("selected");renderNumbers();calculate()});amountInput.oninput=calculate;sameBetBtn.onclick=()=>{selectedNumber=null;hornHighNumber=null;hornHighRoll=null;Array.from(numbersDiv.children).forEach(x=>x.classList.remove("selected"));subSection.classList.add("hidden");resetAmount();renderNumbers();calculate()};clearBtn.onclick=()=>{amountInput.value="";selectedType=null;selectedNumber=null;hornHighNumber=null;hornHighRoll=null;betTypeButtons.forEach(b=>b.classList.remove("selected"));numberSection.classList.add("hidden");subSection.classList.add("hidden");amountSection.classList.add("hidden");calculate()};calculate();
</script></body></html>
